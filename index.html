<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Литературный Тиндер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d0b18; /* Глубокий тёмный фон */
      color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }

    /* Яркий заголовок «Литературный Тиндер» */
    .app-header {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00f2fe, #9d00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.4));
    }

    /* Карточка с бирюзово-фиолетовым неоновым свечением */
    .card-container {
      background: rgba(23, 18, 41, 0.85);
      border-radius: 20px;
      padding: 30px 20px;
      max-width: 320px;
      width: 100%;
      margin-bottom: 25px;
      border: 2px solid #00f2fe;
      box-shadow: 
        0 0 15px rgba(0, 242, 254, 0.4),
        0 0 30px rgba(157, 0, 255, 0.3),
        inset 0 0 15px rgba(157, 0, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px #00f2fe);
    }

    /* Градиентный текст статуса внутри карточки */
    .card-title {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #9d00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    /* Основная неоновая кнопка «Случайный мэтч» */
    .btn-match {
      background: linear-gradient(135deg, #00f2fe 0%, #7f00ff 100%);
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), 0 0 35px rgba(127, 0, 255, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      max-width: 280px;
      text-transform: uppercase;
    }

    .btn-match:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(127, 0, 255, 0.7);
    }

    /* 🔥 ЯРКАЯ, ЗАМЕТНАЯ КНОПКА ПЕРЕХОДА К ПОСТУ */
    .btn-open {
      display: inline-block;
      background: #00f2fe; /* Яркий бирюзовый фон */
      color: #0d0b18 !important; /* Тёмный контрастный текст */
      border: none;
      padding: 14px 22px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transition: all 0.2s ease;
    }

    .btn-open:active {
      transform: scale(0.95);
      background: #4facfe;
    }
  </style>
</head>
<body>

  <h2>Литературный Тиндер</h2>
  
  <div class="card-container" id="card">
    <div class="card-title" id="title">Нажми кнопку ниже!</div>
    <a id="link" class="link-btn" href="#" target="_blank" style="display:none;">Перейти к посту</a>
  </div>

  <button class="btn-match" onclick="getRandomMatch()">🎲 Случайный мэтч</button>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // СПИСОК ТВОИХ КАРТОЧЕК (Добавляй сюда новые)
    const matches = [
      {
        title: "КАРТОЧКА 1",
        url: "https://t.me/litinder/36"
      },
      {
        title: "КАРТОЧКА 2",
        url: "https://t.me/litinder/39"
      },
      {
        title: "КАРТОЧКА 3",
        url: "https://t.me/litinder/43"
      },
      {
        title: "КАРТОЧКА 4",
        url: "https://t.me/litinder/46"
      },
      {
        title: "КАРТОЧКА 5",
        url: "https://t.me/litinder/49"
      },
      {
        title: "КАРТОЧКА 6",
        url: "https://t.me/litinder/53"
      },
      {
        title: "КАРТОЧКА 7",
        url: "https://t.me/litinder/56"
      },
      {
        title: "КАРТОЧКА 8",
        url: "https://t.me/litinder/59"
      },
      {
        title: "КАРТОЧКА 9",
        url: "https://t.me/litinder/62"
      },
       {
        title: "КАРТОЧКА 10",
        url: "https://t.me/litinder/65"
      }
    ];

    function getRandomMatch() {
      const randomIndex = Math.floor(Math.random() * matches.length);
      const match = matches[randomIndex];
      
      document.getElementById('title').innerText = match.title;
      
      const linkElem = document.getElementById('link');
      linkElem.href = match.url;
      linkElem.style.display = 'inline-block';
    }
  </script>
</body>
</html>
