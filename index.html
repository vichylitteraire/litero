<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Литературный Тиндер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .card-container {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 320px;
      width: 100%;
      margin-bottom: 25px;
      border: 1px solid #333;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #ff4b72;
    }
    .card-quote {
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #ddd;
    }
    .btn-match {
      background: linear-gradient(135deg, #ff4b72, #ff758c);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
      transition: transform 0.2s;
    }
    .btn-match:active {
      transform: scale(0.95);
    }
    .link-btn {
      display: inline-block;
      margin-top: 15px;
      color: #ff758c;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h2>💘 Литературный Тиндер</h2>
  
  <div class="card-container" id="card">
    <div class="card-title" id="title">Нажми кнопку ниже!</div>
    <p class="card-quote" id="quote">Готов найти свой идеальный книжный мэтч?</p>
    <a id="link" class="link-btn" href="#" target="_blank" style="display:none;">👉 Перейти к книге / посту</a>
  </div>

  <button class="btn-match" onclick="getRandomMatch()">🎲 Случайный мэтч</button>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // СПИСОК ТВОИХ КАРТОЧЕК (Добавляй сюда новые)
    const matches = [
      {
        title: "Мэтч #1",
        quote: "«— Вы всегда такой мрачный? — Нет, иногда я сплю.»",
        url: "https://t.me/твой_канал/10"
      },
      {
        title: "Мэтч #2",
        quote: "«Слова — это единственный способ удержать то, что уходит навсегда.»",
        url: "https://t.me/твой_канал/15"
      },
      {
        title: "Мэтч #3",
        quote: "«Мы выбираем не книги, книги выбирают нас в нужный момент.»",
        url: "https://t.me/твой_канал/20"
      }
    ];

    function getRandomMatch() {
      const randomIndex = Math.floor(Math.random() * matches.length);
      const match = matches[randomIndex];
      
      document.getElementById('title').innerText = match.title;
      document.getElementById('quote').innerText = match.quote;
      
      const linkElem = document.getElementById('link');
      linkElem.href = match.url;
      linkElem.style.display = 'inline-block';
    }
  </script>
</body>
</html>
