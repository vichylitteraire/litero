<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Литературный Тиндер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0d0b18;
      color: #ffffff;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      text-align: center;
    }

    /* 🔥 Заголовок «Литературный Тиндер» в цвет неонового градиента */
    h2, .app-header {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00f2fe, #9d00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4));
    }

    /* Неоновая рамка-карточка */
    .card-container {
      background: rgba(23, 18, 41, 0.85);
      border-radius: 20px;
      padding: 25px 20px;
      max-width: 320px;
      width: 100%;
      margin-bottom: 25px;
      border: 2px solid #00f2fe;
      box-shadow: 
        0 0 15px rgba(0, 242, 254, 0.4),
        0 0 30px rgba(157, 0, 255, 0.3),
        inset 0 0 15px rgba(157, 0, 255, 0.2);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .card-title, #title {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #9d00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    /* 🔥 Яркая бирюзовая кнопка перехода к посту вместо синего текста */
    #link, #linkBtn, .btn-open {
      display: inline-block;
      background: linear-gradient(135deg, #00f2fe, #4facfe); /* Светло-бирюзовый градиент */
      color: #0d0b18 !important; /* Тёмный чёткий текст */
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      margin-top: 5px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #link:active, #linkBtn:active {
      transform: scale(0.95);
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.9);
    }

    /* Фиолетово-бирюзовая кнопка "Случайный мэтч" */
    .btn-match {
      background: linear-gradient(135deg, #00f2fe 0%, #7f00ff 100%);
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), 0 0 35px rgba(127, 0, 255, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      max-width: 280px;
      text-transform: uppercase;
    }

    .btn-match:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(127, 0, 255, 0.7);
    }
  </style>

    // Переменные для рандома по кругу без повторов
    let currentDeck = [];
    let currentIndex = 0;

    // Функция для перемешивания списка карточек
    function shuffleDeck(array) {
      let shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function getRandomMatch() {
      // Если круг еще не начат или все карточки показаны — перемешиваем заново
      if (currentDeck.length === 0 || currentIndex >= currentDeck.length) {
        currentDeck = shuffleDeck(matches);
        currentIndex = 0;
      }

      // Берем очередную карточку без повторов
      const match = currentDeck[currentIndex];
      currentIndex++;

      // Мгновенный переход прямо к посту в Telegram!

        Telegram.WebApp.openTelegramLink(match.url);
      } else {
        window.open(match.url, '_blank');
      }
    }
